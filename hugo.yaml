baseURL: "http://localhost:1313/"
languageCode: pt-br
title: Sherlock Ramos Blog
theme: ["PaperMod"]

pagination:
  pagerSize: 10

params:
  defaultTheme: auto
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true

  profileMode:
    enabled: true
    title: "Sherlock Ramos"
    subtitle: "Bem-vindo ao meu blog pessoal"
    imageUrl: "https://pbs.twimg.com/profile_images/2060421238992879616/g6HdDJO__400x400.jpg"
    imageTitle: "Sherlock Ramos"
    imageWidth: 150
    imageHeight: 150
    buttons:
      - name: Posts
        url: /posts/
      - name: Tags
        url: /tags/

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
